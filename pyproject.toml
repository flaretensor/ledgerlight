[project]
name = "ledgerlight"
version = "0.1.0"
description = "Local financial document retrieval and cited answers"
requires-python = ">=3.12,<3.13"
dependencies = [
 "typer>=0.16,<1",
 "pydantic>=2.10,<3",
 "pyyaml>=6,<7",
 "numpy>=2,<3",
 "pandas>=2.2,<3",
 "pandera[pandas]>=0.24,<0.28",
 "bm25s>=0.2,<0.3",
 "ranx>=0.3,<0.4",
 "rank-bm25==0.2.2",
 "torch==2.8.0",
 "sentence-transformers>=5.1,<5.3",
 "transformers>=4.57,<5",
 "datasets>=4,<5",
 "accelerate>=1.10,<2",
 "catboost>=1.2.8,<1.3",
 "optuna>=4.5,<5",
 "mlflow>=3.4,<3.8",
 "dvc>=3.63,<4",
 "psycopg[binary]>=3.2,<4",
 "psycopg2-binary>=2.9,<3",
 "qdrant-client>=1.15,<2",
 "fastapi>=0.118,<1",
 "uvicorn>=0.35,<1",
 "httpx>=0.28,<1",
 "streamlit>=1.50,<2",
 "prometheus-client>=0.23,<1",
 "locust>=2.40,<3",
 "onnx>=1.19,<2",
 "onnxruntime-gpu>=1.23,<1.24",
 "python-dotenv>=1.1,<2",
 "sqlalchemy>=2.0,<2.1",
]
[project.scripts]
ledgerlight = "ledgerlight.cli:app"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[dependency-groups]
dev = [
    "ruff>=0.14,<1",
    "pytest>=8.4,<9",
    "playwright>=1.65.0",
]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.uv.sources]
torch = { index = "pytorch" }
[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerlight"]
