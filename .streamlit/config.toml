[browser]
gatherUsageStats = false
[server]
address = "127.0.0.1"
port = 8501
headless = true
fileWatcherType = "none"
[theme]
primaryColor = "#DF2F1F"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f5f5"
textColor = "#1f1f1f"
font = "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
headingFontSizes = ["1.375rem", "1.125rem", "1.125rem"]
headingFontWeights = [650, 600, 600]
baseRadius = "10px"
buttonRadius = "full"
dataframeHeaderTextColor = "#1f1f1f"
dataframeBorderColor = "#c7cace"

[client]
toolbarMode = "minimal"
