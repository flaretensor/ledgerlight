services:
  triton:
    image: nvcr.io/nvidia/tritonserver:26.01-py3
    network_mode: host
    restart: "no"
    gpus: all
    user: "1000:1000"
    working_dir: /workspace
    environment:
      TMPDIR: /workspace/.tmp
      XDG_CACHE_HOME: /workspace/.cache
      CUDA_CACHE_PATH: /workspace/.cache/cuda
      TRITON_CACHE_DIR: /workspace/.cache/triton
    profiles: [triton]
    command: ["tritonserver", "--model-repository=/models/triton", "--http-address=127.0.0.1", "--http-port=8002", "--grpc-address=127.0.0.1", "--grpc-port=8003", "--metrics-address=127.0.0.1", "--metrics-port=8004", "--cuda-memory-pool-byte-size=0:67108864", "--pinned-memory-pool-byte-size=67108864"]
    volumes:
      - ./models:/models:ro
      - .:/workspace
