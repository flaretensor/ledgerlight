stages:
  ingest:
    cmd: python -m ledgerlight.data ingest
    deps:
    - src/ledgerlight/data.py
    params:
    - data
    outs:
    - data/raw:
        persist: true
  validate:
    cmd: python -m ledgerlight.data validate
    deps:
    - data/raw
    - src/ledgerlight/data.py
    - config/company_aliases.json
    outs:
    - data/processed:
        persist: true
  index_bm25:
    cmd: python -m ledgerlight.retrieval index_bm25
    deps:
    - data/processed
    - src/ledgerlight/retrieval.py
    outs:
    - indices/bm25:
        persist: true
  embed:
    cmd: python -m ledgerlight.retrieval embed
    deps:
    - data/processed
    - src/ledgerlight/retrieval.py
    - src/ledgerlight/common.py
    - src/ledgerlight/cross_encoder.py
    - src/ledgerlight/pairs.py
    params:
    - encoder
    outs:
    - indices/base:
        persist: true
  baselines:
    cmd: python -m ledgerlight.evaluation
    deps:
    - data/processed
    - indices/bm25
    - indices/base
    - src/ledgerlight/evaluation.py
    - src/ledgerlight/retrieval.py
    - src/ledgerlight/cross_encoder.py
    - src/ledgerlight/pairs.py
    - src/ledgerlight/test_access.py
    params:
    - retrieval
    - cross_encoder
    outs:
    - data/baselines:
        persist: true
  train:
    cmd: python -m ledgerlight.training
    deps:
    - data/processed
    - data/baselines
    - indices/bm25
    - indices/base
    - src/ledgerlight/training.py
    - src/ledgerlight/features.py
    - src/ledgerlight/retrieval.py
    - src/ledgerlight/common.py
    - src/ledgerlight/cross_encoder.py
    - src/ledgerlight/pairs.py
    - config/company_aliases.json
    params:
    - training
    - encoder
    - cross_encoder
    - retrieval
    outs:
    - data/training:
        persist: true
    - models/encoder:
        persist: true
    - models/cross_encoder:
        persist: true
    - models/ltr:
        persist: true
    - indices/trained:
        persist: true
  evaluate:
    cmd: python -c 'from ledgerlight.final_evaluation import evaluate_dev; evaluate_dev()'
    deps:
    - data/training
    - data/baselines
    - indices/bm25
    - indices/base
    - indices/trained
    - models/encoder
    - models/cross_encoder
    - models/ltr
    - src/ledgerlight/final_evaluation.py
    - src/ledgerlight/evaluation.py
    - src/ledgerlight/test_access.py
    - src/ledgerlight/common.py
    outs:
    - data/evaluation:
        persist: true
    - models/production:
        persist: true
